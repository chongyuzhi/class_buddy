<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassBuddy Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0f4f8;
      --surface:  #ffffff;
      --header:   #1a56a0;
      --accent:   #2563eb;
      --accent2:  #7c3aed;
      --user-bg:  #2563eb;
      --user-fg:  #ffffff;
      --bot-bg:   #ffffff;
      --bot-fg:   #1f2328;
      --border:   #d1d5db;
      --muted:    #6b7280;
      --card-hd:  #eff6ff;
      --card-bd:  #bfdbfe;
      --break-bg: #fef9c3;
      --break-bd: #fde047;
      --radius:   14px;
      --shadow:   0 1px 3px rgba(0,0,0,.12);
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: var(--header);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .avatar {
      width: 40px; height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 17px; font-weight: 700; }
    .header-text p  { font-size: 12px; opacity: .8; }
    .lang-toggle {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,.6);
      color: #fff;
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }
    .lang-btn.active, .lang-btn:hover {
      background: rgba(255,255,255,.25);
      border-color: #fff;
    }

    /* ── Chat area ────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 680px;
      width: 100%;
    }
    .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.bot  { align-self: flex-start; }

    .bubble-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      background: #dbeafe;
    }
    .bubble-row.user .bubble-icon { background: #c7d2fe; }

    .bubble {
      padding: 9px 13px;
      border-radius: var(--radius);
      max-width: calc(100% - 48px);
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-row.user .bubble {
      background: var(--user-bg);
      color: var(--user-fg);
      border-bottom-right-radius: 4px;
    }
    .bubble-row.bot .bubble {
      background: var(--bot-bg);
      color: var(--bot-fg);
      border-bottom-left-radius: 4px;
    }

    /* ── Timetable card ───────────────────────────────────── */
    .tt-card {
      background: var(--surface);
      border: 1px solid var(--card-bd);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      max-width: 520px;
      width: 100%;
    }
    .tt-card-header {
      background: var(--card-hd);
      padding: 9px 14px;
      font-weight: 700;
      font-size: 14px;
      border-bottom: 1px solid var(--card-bd);
    }
    .tt-row {
      display: flex;
      padding: 8px 14px;
      gap: 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
      align-items: flex-start;
    }
    .tt-row:last-child { border-bottom: none; }
    .tt-row.break-row { background: var(--break-bg); }
    .tt-time {
      white-space: nowrap;
      color: var(--muted);
      min-width: 115px;
      font-size: 12.5px;
      padding-top: 1px;
    }
    .tt-name { flex: 1; font-weight: 500; }
    .tt-row.break-row .tt-name { color: #92400e; font-weight: 400; font-style: italic; }

    /* ── Quick-action buttons ─────────────────────────────── */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-width: 580px;
      align-self: flex-start;
      padding-left: 36px;
    }
    .qa-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      color: var(--bot-fg);
    }
    .qa-btn:hover { background: #eff6ff; border-color: var(--accent); color: var(--accent); }

    /* ── Day picker ───────────────────────────────────────── */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      max-width: 380px;
      padding-left: 36px;
    }
    .day-grid .qa-btn:last-child { grid-column: 1 / -1; }

    /* ── Input bar ────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #msg-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 9px 15px;
      font-size: 14.5px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      outline: none;
      transition: border-color .15s;
      line-height: 1.45;
    }
    #msg-input:focus { border-color: var(--accent); }
    #send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover { background: #1d4ed8; }

    /* ── Scrollbar ────────────────────────────────────────── */
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: #c1c7d0; border-radius: 4px; }

    @media (max-width: 480px) {
      .tt-time { min-width: 90px; font-size: 11.5px; }
      .bubble { font-size: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">📚</div>
  <div class="header-text">
    <h1>ClassBuddy Bot</h1>
    <p id="status-text">Timetable assistant · Malaysia time</p>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn"        id="btn-bm" onclick="setLang('bm')">BM</button>
  </div>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Type a day and time, e.g. Monday 10:30 AM …"></textarea>
  <button id="send-btn" onclick="handleSend()" title="Send">➤</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SCHEDULE — exact port of bot.py SCHEDULE dict
   Each entry: [startMin, endMin, bmName, enName]
   Times are minutes after midnight (24 h).
═══════════════════════════════════════════════════════════ */
const SCHEDULE = {
  Monday: [
    [450,  510,  "Perhimpunan",                                      "Assembly"],
    [510,  540,  "Rehat",                                            "Break"],
    [540,  600,  "Gantian / Ujian",                                  "Replacement class / Test (as shown on timetable)"],
    [600,  720,  "English Language Proficiency (MPU6122)",           "English Language Proficiency (MPU6122)"],
    [780,  840,  "Rehat",                                            "Break"],
    [960,  1020, "Sejarah Lisan dan Pendokumentasian (SJHK6023)",    "Oral History and Documentation (SJHK6023)"],
  ],
  Tuesday: [
    [450,  570,  "Teknologi untuk Pengajaran dan Pembelajaran (EDUP6023)", "Technology for Teaching and Learning (EDUP6023)"],
    [570,  600,  "Rehat",                                            "Break"],
    [660,  780,  "Sejarah Lisan dan Pendokumentasian (SJHK6023)",    "Oral History and Documentation (SJHK6023)"],
    [780,  840,  "Rehat",                                            "Break"],
    [960,  1020, "Perkembangan Perlembagaan Persekutuan Malaysia (SJHK6033)", "Development of the Federal Constitution of Malaysia (SJHK6033)"],
  ],
  Wednesday: [
    [450,  570,  "Pensejarahan Malaysia (SJHK6013)",                 "Malaysian Historiography (SJHK6013)"],
    [570,  600,  "Rehat",                                            "Break"],
    [600,  720,  "Perkembangan Perlembagaan Persekutuan Malaysia (SJHK6033)", "Development of the Federal Constitution of Malaysia (SJHK6033)"],
    [720,  780,  "Sejarah Pendidikan di Malaysia (EDUP6013)",        "History of Education in Malaysia (EDUP6013)"],
    [780,  840,  "Rehat",                                            "Break"],
    [960,  1020, "Mentor",                                           "Mentor session"],
  ],
  Thursday: [
    [450,  570,  "GFEPS (kod/nama seperti dalam jadual)",            "GFEPS (course name as shown on timetable)"],
    [570,  600,  "Rehat",                                            "Break"],
    [780,  840,  "Rehat",                                            "Break"],
  ],
  Friday: [
    [420,  480,  "Insaniah",                                         "Insaniah"],
    [480,  510,  "Rehat",                                            "Break"],
    [510,  630,  "Sejarah Pendidikan di Malaysia (EDUP6013)",        "History of Education in Malaysia (EDUP6013)"],
    [630,  690,  "Pensejarahan Malaysia (SJHK6013)",                 "Malaysian Historiography (SJHK6013)"],
    [690,  780,  "Rehat",                                            "Break"],
    [780,  840,  "Rehat",                                            "Break"],
    [960,  1020, "Teknologi untuk Pengajaran dan Pembelajaran (EDUP6023)", "Technology for Teaching and Learning (EDUP6023)"],
  ],
};

const DAY_MS = { Monday:"Isnin", Tuesday:"Selasa", Wednesday:"Rabu", Thursday:"Khamis", Friday:"Jumaat" };

const DAYS_MAP = {
  monday:"Monday", mon:"Monday", isnin:"Monday",
  tuesday:"Tuesday", tue:"Tuesday", tues:"Tuesday", selasa:"Tuesday",
  wednesday:"Wednesday", wed:"Wednesday", rabu:"Wednesday",
  thursday:"Thursday", thu:"Thursday", thurs:"Thursday", khamis:"Thursday",
  friday:"Friday", fri:"Friday", jumaat:"Friday",
};

/* ── State ──────────────────────────────────────────────── */
let lang = "en";

/* ── Utilities ──────────────────────────────────────────── */
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const suffix = h < 12 ? "AM" : "PM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,"0")} ${suffix}`;
}
function fmtRange(s, e) { return `${fmtTime(s)}–${fmtTime(e)}`; }

function parseDay(text) {
  const low = text.toLowerCase();
  for (const [token, day] of Object.entries(DAYS_MAP)) {
    const re = new RegExp(`\\b${token.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`);
    if (re.test(low)) return day;
  }
  return null;
}

function parseTime(text) {
  const low = text.toLowerCase().replace(/\./g, "");
  // HH:MM [am/pm]
  let m = low.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/);
  if (m) {
    let h = parseInt(m[1]), min = parseInt(m[2]);
    if (min > 59) return null;
    const suf = m[3];
    if (suf) {
      if (h < 1 || h > 12) return null;
      h = h % 12 + (suf === "pm" ? 12 : 0);
    } else if (h < 0 || h > 23) return null;
    return h * 60 + min;
  }
  // H am/pm
  m = low.match(/\b(\d{1,2})\s*(am|pm)\b/);
  if (m) {
    let h = parseInt(m[1]);
    if (h < 1 || h > 12) return null;
    h = h % 12 + (m[2] === "pm" ? 12 : 0);
    return h * 60;
  }
  // pukul / jam / at N
  m = low.match(/\b(?:at\s+)?(\d{1,2})(?:\s*(?:o'?clock))?\b/);
  if (m && /( at |pukul |jam |now|sekarang)/.test(low)) {
    const h = parseInt(m[1]);
    if (h >= 0 && h <= 23) return h * 60;
  }
  return null;
}

function getEvent(day, minute) {
  for (const [s, e, bm, en] of (SCHEDULE[day] || [])) {
    if (minute >= s && minute < e) return [s, e, bm, en];
  }
  return null;
}

function nowMYT() {
  // Returns a Date-like object adjusted to Asia/Kuala_Lumpur (UTC+8)
  const now = new Date();
  const myt = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kuala_Lumpur" }));
  return myt;
}

function todayDayName() {
  return new Date().toLocaleDateString("en-US", {
    timeZone: "Asia/Kuala_Lumpur", weekday: "long"
  });
}

/* ── Core logic (mirrors check_time / display_day) ───────── */
function checkTime(day, minute) {
  const event = getEvent(day, minute);
  const dayLabel = lang === "bm" ? DAY_MS[day] : day;
  if (event) {
    const [s, e, bmName, enName] = event;
    const name = lang === "bm" ? bmName : enName;
    if (bmName.toLowerCase() === "rehat") {
      return lang === "bm"
        ? `☕ ${dayLabel}, ${fmtTime(minute)}: Dalam jadual, waktu ini ditandakan sebagai rehat (${fmtRange(s, e)}).`
        : `☕ ${dayLabel} at ${fmtTime(minute)}: This time is marked as a break (${fmtRange(s, e)}).`;
    }
    return lang === "bm"
      ? `📚 Ya, ada aktiviti pada ${dayLabel}.\nMasa: ${fmtRange(s, e)}\nAktiviti: ${name}`
      : `📚 Yes, you have a scheduled activity on ${dayLabel}.\nTime: ${fmtRange(s, e)}\nClass/activity: ${name}`;
  }
  return lang === "bm"
    ? `✅ Tiada kelas atau aktiviti yang disenaraikan pada ${dayLabel}, ${fmtTime(minute)}. Sila semak jadual asal untuk memastikan waktu kosong ini bukan tempoh yang tidak dipaparkan.`
    : `✅ No class or activity is listed for ${dayLabel} at ${fmtTime(minute)}. Please check the original timetable to confirm this is a genuine free period rather than an unlisted period.`;
}

/* ── Chat rendering ─────────────────────────────────────── */
const chat = document.getElementById("chat");

function scrollBottom() {
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

function addUserBubble(text) {
  const row = document.createElement("div");
  row.className = "bubble-row user";
  row.innerHTML = `<div class="bubble-icon">🧑‍🎓</div><div class="bubble">${escHtml(text)}</div>`;
  chat.appendChild(row);
  scrollBottom();
}

function addBotBubble(text) {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.innerHTML = `<div class="bubble-icon">🤖</div><div class="bubble">${escHtml(text)}</div>`;
  chat.appendChild(row);
  scrollBottom();
  return row;
}

function addTimetableCard(day) {
  const rows = SCHEDULE[day];
  const dayLabel = lang === "bm" ? `${DAY_MS[day]} (${day})` : day;
  const row = document.createElement("div");
  row.className = "bubble-row bot";

  if (!rows || rows.length === 0) {
    row.innerHTML = `<div class="bubble-icon">🤖</div><div class="bubble">${
      lang === "bm"
        ? `Tiada jadual tersedia untuk ${DAY_MS[day] || day}.`
        : `No timetable is available for ${day}.`
    }</div>`;
    chat.appendChild(row);
    scrollBottom();
    return;
  }

  let inner = `<div class="tt-card">
    <div class="tt-card-header">🗓️ ${lang === "bm" ? "Jadual" : "Timetable"} — ${dayLabel}</div>`;
  for (const [s, e, bm, en] of rows) {
    const isBreak = bm.toLowerCase() === "rehat";
    const name = lang === "bm" ? bm : en;
    inner += `<div class="tt-row${isBreak ? " break-row" : ""}">
      <span class="tt-time">${fmtRange(s, e)}</span>
      <span class="tt-name">${escHtml(name)}</span>
    </div>`;
  }
  inner += `</div>`;
  row.innerHTML = `<div class="bubble-icon">🤖</div>${inner}`;
  chat.appendChild(row);
  scrollBottom();
}

function addQuickActions() {
  const wrap = document.createElement("div");
  wrap.className = "quick-actions";
  const btns = lang === "bm"
    ? [
        ["📍 Semak sekarang",  "check_now"],
        ["🗓️ Jadual hari ini", "today"],
        ["📅 Pilih hari",      "schedule"],
        ["❓ Bantuan",          "help"],
      ]
    : [
        ["📍 Check now",          "check_now"],
        ["🗓️ Today's timetable",  "today"],
        ["📅 Choose a day",       "schedule"],
        ["❓ Help",               "help"],
      ];
  for (const [label, cmd] of btns) {
    const b = document.createElement("button");
    b.className = "qa-btn";
    b.textContent = label;
    b.onclick = () => handleCommand(cmd, label);
    wrap.appendChild(b);
  }
  chat.appendChild(wrap);
  scrollBottom();
}

function addDayPicker() {
  const wrap = document.createElement("div");
  wrap.className = "day-grid";
  const days = [
    ["Monday / Isnin",    "Monday"],
    ["Tuesday / Selasa",  "Tuesday"],
    ["Wednesday / Rabu",  "Wednesday"],
    ["Thursday / Khamis", "Thursday"],
    ["Friday / Jumaat",   "Friday"],
  ];
  for (const [label, day] of days) {
    const b = document.createElement("button");
    b.className = "qa-btn";
    b.textContent = label;
    b.onclick = () => {
      addUserBubble(label);
      addTimetableCard(day);
      addQuickActions();
    };
    wrap.appendChild(b);
  }
  chat.appendChild(wrap);
  scrollBottom();
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ── Commands ───────────────────────────────────────────── */
function handleCommand(cmd, displayText) {
  if (displayText) addUserBubble(displayText);

  if (cmd === "check_now") {
    const now  = nowMYT();
    const day  = now.toLocaleDateString("en-US", { weekday: "long" });
    const mins = now.getHours() * 60 + now.getMinutes();
    if (!SCHEDULE[day]) {
      addBotBubble(lang === "bm"
        ? "Tiada jadual untuk hari ini."
        : "No timetable is provided for today.");
    } else {
      addBotBubble(checkTime(day, mins));
    }
    addQuickActions();
    return;
  }

  if (cmd === "today") {
    const day = todayDayName();
    if (!SCHEDULE[day]) {
      addBotBubble(lang === "bm"
        ? "Tiada jadual untuk hari ini dalam jadual yang dimuatkan."
        : "No timetable is provided for today.");
      addQuickActions();
    } else {
      addTimetableCard(day);
      addQuickActions();
    }
    return;
  }

  if (cmd === "schedule") {
    addBotBubble(lang === "bm" ? "Pilih hari:" : "Choose a day:");
    addDayPicker();
    return;
  }

  if (cmd === "help") {
    const text = lang === "bm"
      ? `Cara menggunakan ClassBuddy Bot:
• Semak masa: /check Isnin 10:30
• Lihat jadual: /day Rabu
• Lihat jadual hari ini: /today
• Pilih hari: /schedule
• Tukar bahasa: gunakan butang EN / BM di atas

Masa boleh ditaip seperti 10:30 AM, 2 PM atau 14:30.`
      : `How to use ClassBuddy Bot:
• Check a time: /check Monday 10:30 AM
• View a day: /day Wednesday
• View today's timetable: /today
• Choose a day: /schedule
• Change language: use the EN / BM buttons above

Times can be entered as 10:30 AM, 2 PM, or 14:30.`;
    addBotBubble(text);
    addQuickActions();
    return;
  }
}

/* ── Free-text message handler ──────────────────────────── */
function processMessage(text) {
  const low = text.toLowerCase().trim();

  // Slash commands
  if (low === "/start")    { handleCommand("help", null); addQuickActions(); return; }
  if (low === "/today")    { handleCommand("today", null); return; }
  if (low === "/schedule") { handleCommand("schedule", null); return; }
  if (low === "/help")     { handleCommand("help", null); return; }

  // /lang
  const langM = low.match(/^\/lang\s+(en|bm)$/);
  if (langM) { setLang(langM[1]); return; }

  // /day <day>
  const dayM = low.match(/^\/day\s+(.+)$/);
  if (dayM) {
    const d = parseDay(dayM[1]);
    if (d) { addTimetableCard(d); addQuickActions(); }
    else addBotBubble(lang === "bm" ? "Contoh: /day Isnin" : "Example: /day Monday");
    return;
  }

  // /check <day> <time>
  const chkM = low.match(/^\/check\s+(.+)$/);
  if (chkM) {
    const d = parseDay(chkM[1]), m = parseTime(chkM[1]);
    if (d && m !== null) { addBotBubble(checkTime(d, m)); addQuickActions(); }
    else addBotBubble(lang === "bm"
      ? "Contoh: /check Isnin 10:30 pagi atau /check Tuesday 2 PM"
      : "Example: /check Monday 10:30 AM or /check Tuesday 14:00");
    return;
  }

  // Button aliases
  if (["❓ help","help","bantuan","❓ bantuan"].includes(low))
    { handleCommand("help", null); return; }
  if (["📅 choose a day","📅 pilih hari"].includes(low))
    { handleCommand("schedule", null); return; }
  if (["🗓️ today's timetable","jadual hari ini","🗓️ jadual hari ini"].includes(low))
    { handleCommand("today", null); return; }
  if (["📍 check now","📍 semak sekarang","check now","sekarang"].includes(low))
    { handleCommand("check_now", null); return; }

  // Day + time
  const day    = parseDay(text);
  const minute = parseTime(text);
  if (day && minute !== null) {
    addBotBubble(checkTime(day, minute));
    addQuickActions();
    return;
  }

  // Day + schedule keyword
  const schedWords = ["timetable","schedule","jadual","classes","kelas","what do i have","show"];
  if (day && schedWords.some(w => low.includes(w))) {
    addTimetableCard(day);
    addQuickActions();
    return;
  }

  // "today" / "now" keywords
  const nowWords = ["today","hari ini","sekarang","right now","now"];
  if (nowWords.some(w => low.includes(w))) {
    const d = todayDayName();
    const myt = nowMYT();
    const mins = myt.getHours() * 60 + myt.getMinutes();
    if (SCHEDULE[d]) { addBotBubble(checkTime(d, mins)); }
    else addBotBubble(lang === "bm" ? "Tiada jadual untuk hari ini." : "No timetable is provided for today.");
    addQuickActions();
    return;
  }

  // Fallback
  addBotBubble(lang === "bm"
    ? "Saya belum dapat memahami permintaan itu. Cuba taip 'Isnin 10:30 pagi', gunakan /schedule untuk memilih hari, atau taip /help untuk bantuan."
    : "I couldn't match that request. Try 'Monday 10:30 AM', use /schedule to choose a day, or type /help for instructions.");
  addQuickActions();
}

/* ── Input handling ─────────────────────────────────────── */
function handleSend() {
  const inp = document.getElementById("msg-input");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  inp.style.height = "";
  addUserBubble(text);
  processMessage(text);
}

document.getElementById("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

// Auto-resize textarea
document.getElementById("msg-input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

/* ── Language toggle ────────────────────────────────────── */
function setLang(l) {
  lang = l;
  document.getElementById("btn-en").classList.toggle("active", l === "en");
  document.getElementById("btn-bm").classList.toggle("active", l === "bm");
  document.getElementById("msg-input").placeholder =
    l === "bm" ? "Taip hari dan masa, cth: Isnin 10:30 pagi …"
               : "Type a day and time, e.g. Monday 10:30 AM …";
  document.getElementById("status-text").textContent =
    l === "bm" ? "Pembantu jadual · Waktu Malaysia"
               : "Timetable assistant · Malaysia time";

  const msgText = l === "bm"
    ? "Bahasa ditukar kepada Bahasa Melayu."
    : "Language set to English.";
  addBotBubble(msgText);
  addQuickActions();
}

/* ── Boot sequence ──────────────────────────────────────── */
(function boot() {
  const myt = nowMYT();
  const timeStr = myt.toLocaleTimeString("en-US", {
    hour: "2-digit", minute: "2-digit", hour12: true
  });
  const greeting = myt.getHours() < 12 ? "Good morning" :
                   myt.getHours() < 17 ? "Good afternoon" : "Good evening";
  addBotBubble(
    `${greeting}! 👋 I'm ClassBuddy Bot.\n\n` +
    `Your current Malaysia time is ${timeStr}.\n\n` +
    `I can check your timetable using the schedule provided.\n` +
    `• Type a day and time: Monday 10:30 AM\n` +
    `• Use /today for today's timetable\n` +
    `• Use /schedule to pick a day\n` +
    `• Switch to Bahasa Melayu with the BM button above\n\n` +
    `Choose an option below or type your question:`
  );
  addQuickActions();
})();
</script>
